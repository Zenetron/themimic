<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MIMIC</title>
    <style>
        :root {
            --bg-color: #050510;
            --text-color: #fff;
            --accent-color: #00ffff;
            --panel-bg: rgba(10, 10, 20, 0.85);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 20px var(--accent-color);
            max-width: 600px;
            width: 90%;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            margin-top: 0;
            font-size: 3em;
            text-shadow: 0 0 10px var(--accent-color);
            letter-spacing: 5px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        button {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: inherit;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2) inset;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .controls-info {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: #ccc;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
        }

        .controls-info div {
            flex: 1;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .hud-player {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            font-size: 1.2em;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-player" id="hudP1">Player 1 (WASD/Space)</div>
        <div id="scoreBoard">P1: 0 - P2: 0</div>
        <div class="hud-player" id="hudP2">Player 2 (Arrows/Enter)</div>
    </div>

    <div id="uiLayer">
        <!-- Main Menu -->
        <div id="mainMenu" class="panel">
            <h1>THE MIMIC</h1>
            <p>Hide in the crowd. Find the other player.</p>

            <div class="settings-grid">
                <div>
                    <label for="p1Avatar">Player 1 Avatar:</label>
                    <select id="p1Avatar">
                        <option value="Cyber-Drone">Cyber-Drone</option>
                        <option value="Neon-Orb">Neon-Orb</option>
                        <option value="Shadow-Walker">Shadow-Walker</option>
                        <option value="Bio-Cell">Bio-Cell</option>
                    </select>
                </div>
                <div>
                    <label for="p2Avatar">Player 2 Avatar:</label>
                    <select id="p2Avatar">
                        <option value="Neon-Orb">Neon-Orb</option>
                        <option value="Cyber-Drone">Cyber-Drone</option>
                        <option value="Shadow-Walker">Shadow-Walker</option>
                        <option value="Bio-Cell">Bio-Cell</option>
                    </select>
                </div>
                <div style="grid-column: span 2;">
                    <label for="themeSelect">Environment Theme:</label>
                    <select id="themeSelect">
                        <option value="Neon District">Neon District</option>
                        <option value="Biological Lab">Biological Lab</option>
                        <option value="Deep Space">Deep Space</option>
                    </select>
                </div>

                <div class="controls-info">
                    <div>
                        <strong>PLAYER 1</strong><br>
                        Move: W A S D<br>
                        Tag: SPACE
                    </div>
                    <div>
                        <strong>PLAYER 2</strong><br>
                        Move: Arrows<br>
                        Tag: ENTER
                    </div>
                </div>
            </div>

            <button id="startBtn">ENTER ARENA</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverMenu" class="panel hidden">
            <h1 id="winnerText">PLAYER X WINS!</h1>
            <p id="gameOverSubtext"></p>
            <br>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const mainMenu = document.getElementById('mainMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const winnerText = document.getElementById('winnerText');
        const scoreBoard = document.getElementById('scoreBoard');
        const gameOverSubtext = document.getElementById('gameOverSubtext');

        // Game State
        const STATE = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };
        let currentState = STATE.MENU;

        // Settings
        const TOTAL_ENTITIES = 50;
        let MAP_SIZE = { w: window.innerWidth, h: window.innerHeight };
        const LERP_FACTOR = 0.1;
        const TAG_RANGE = 60;
        const REVEAL_DURATION = 3000;

        let entities = [];
        let p1Score = 0;
        let p2Score = 0;

        // Environment details
        let theme = "Neon District";
        let bgParticles = [];

        // Input tracking
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Utility: Random range
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Resize
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            MAP_SIZE = { w: window.innerWidth, h: window.innerHeight };
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ------------------
        // PROCEDURAL AVATARS
        // ------------------
        const Avatars = {
            "Cyber-Drone": (ctx, x, y, size, color, isMoving, angle) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;

                // Triangle body
                ctx.beginPath();
                ctx.moveTo(size, 0);
                ctx.lineTo(-size, -size * 0.8);
                ctx.lineTo(-size * 0.5, 0);
                ctx.lineTo(-size, size * 0.8);
                ctx.closePath();
                ctx.stroke();

                // Engine glow
                if (isMoving) {
                    ctx.beginPath();
                    ctx.arc(-size * 0.8, 0, size * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                }
                ctx.restore();
            },
            "Neon-Orb": (ctx, x, y, size, color, isMoving, angle) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;

                // Outer ring
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.stroke();

                // Inner core pulsing
                const pulse = isMoving ? Math.sin(Date.now() / 100) * 0.5 + 0.5 : 0.2;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();

                // Directional pip
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(size * 0.5, 0);
                ctx.lineTo(size * 1.2, 0);
                ctx.stroke();

                ctx.restore();
            },
            "Shadow-Walker": (ctx, x, y, size, color, isMoving, angle) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                // Dark body
                ctx.fillStyle = '#111';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowColor = color;
                ctx.shadowBlur = 5;

                ctx.beginPath();
                ctx.rect(-size * 0.8, -size * 0.6, size * 1.6, size * 1.2);
                ctx.fill();
                ctx.stroke();

                // "Eyes"
                ctx.fillStyle = color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(size * 0.4, -size * 0.3, size * 0.2, 0, Math.PI * 2);
                ctx.arc(size * 0.4, size * 0.3, size * 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Leg hints
                if (isMoving) {
                    const legOffset = Math.sin(Date.now() / 150) * size * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.4, -size * 0.6);
                    ctx.lineTo(-size * 0.4 + legOffset, -size * 1.2);
                    ctx.moveTo(size * 0.2, -size * 0.6);
                    ctx.lineTo(size * 0.2 - legOffset, -size * 1.2);

                    ctx.moveTo(-size * 0.4, size * 0.6);
                    ctx.lineTo(-size * 0.4 - legOffset, size * 1.2);
                    ctx.moveTo(size * 0.2, size * 0.6);
                    ctx.lineTo(size * 0.2 + legOffset, size * 1.2);
                    ctx.stroke();
                }
                ctx.restore();
            },
            "Bio-Cell": (ctx, x, y, size, color, isMoving, angle) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.strokeStyle = color;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;

                const time = Date.now() / 300;
                const points = 8;

                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const theta = (i / points) * Math.PI * 2;
                    let r = size;
                    if (isMoving) {
                        r += Math.sin(time + theta * 3) * size * 0.2;
                    }
                    const px = Math.cos(theta) * r;
                    const py = Math.sin(theta) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Nucleus
                ctx.beginPath();
                ctx.arc(size * 0.2, 0, size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();

                ctx.restore();
            }
        };

        // ------------------
        // ENTITY SYSTEM
        // ------------------
        class Entity {
            constructor(isPlayer, playerNum = 0, avatarType = "Cyber-Drone") {
                this.isPlayer = isPlayer;
                this.playerNum = playerNum; // 1 or 2
                this.avatarType = avatarType;

                // Position & Movement
                this.x = rand(0, MAP_SIZE.w);
                this.y = rand(0, MAP_SIZE.h);
                this.vx = 0;
                this.vy = 0;
                this.angle = rand(0, Math.PI * 2);
                this.targetAngle = this.angle;

                // Visuals
                this.size = 20;
                this.baseColor = this.getBotColor();
                this.color = this.baseColor;
                this.revealedUntil = 0;

                // AI State
                this.aiState = 'IDLE'; // IDLE, MOVING
                this.aiTimer = rand(500, 2000);
                this.aiSpeed = rand(1, 3);

                // Player Action Cooldown
                this.lastTagTime = 0;

                // Input velocity mapping
                this.inputVx = 0;
                this.inputVy = 0;
            }

            getBotColor() {
                const colors = ['#ff0055', '#00ffaa', '#eeaa00', '#aa00ff'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update(dt) {
                if (this.isPlayer) {
                    this.updatePlayerInput();
                } else {
                    this.updateAILogic(dt);
                }

                // Smooth rotation towards velocity
                if (this.vx !== 0 || this.vy !== 0) {
                    this.targetAngle = Math.atan2(this.vy, this.vx);
                }

                // Lerp angle
                let dAngle = this.targetAngle - this.angle;
                // Normalize to -PI to PI
                while (dAngle > Math.PI) dAngle -= Math.PI * 2;
                while (dAngle < -Math.PI) dAngle += Math.PI * 2;
                this.angle += dAngle * 0.1;

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Clamp to map bounds
                this.x = Math.max(this.size, Math.min(MAP_SIZE.w - this.size, this.x));
                this.y = Math.max(this.size, Math.min(MAP_SIZE.h - this.size, this.y));

                // Check Reveal State
                if (Date.now() < this.revealedUntil) {
                    this.color = '#ffffff'; // Bright white when revealed
                } else {
                    this.color = this.baseColor;
                }
            }

            updatePlayerInput() {
                let thrust = false;
                this.vx = 0;
                this.vy = 0;
                const speed = 3;

                if (this.playerNum === 1) {
                    if (keys['KeyW']) this.vy -= speed;
                    if (keys['KeyS']) this.vy += speed;
                    if (keys['KeyA']) this.vx -= speed;
                    if (keys['KeyD']) this.vx += speed;
                } else {
                    if (keys['ArrowUp']) { this.vy -= speed; }
                    if (keys['ArrowDown']) { this.vy += speed; }
                    if (keys['ArrowLeft']) { this.vx -= speed; }
                    if (keys['ArrowRight']) { this.vx += speed; }
                }

                // Normalize diagonal movement
                if (this.vx !== 0 && this.vy !== 0) {
                    const len = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    this.vx = (this.vx / len) * speed;
                    this.vy = (this.vy / len) * speed;
                }
            }

            updateAILogic(dt) {
                this.aiTimer -= dt;

                if (this.aiTimer <= 0) {
                    // Switch state
                    if (this.aiState === 'IDLE') {
                        this.aiState = 'MOVING';
                        this.aiTimer = rand(1000, 3000); // Move for 1-3 seconds
                        this.targetAngle = rand(0, Math.PI * 2);
                        this.aiSpeed = rand(1.5, 3.5);
                    } else {
                        this.aiState = 'IDLE';
                        this.aiTimer = rand(1000, 2000); // Pause for 1-2 seconds
                    }
                }

                if (this.aiState === 'MOVING') {
                    this.vx = Math.cos(this.targetAngle) * this.aiSpeed;
                    this.vy = Math.sin(this.targetAngle) * this.aiSpeed;

                    // Bounce off walls predictively
                    if (this.x + this.vx < this.size || this.x + this.vx > MAP_SIZE.w - this.size) this.targetAngle = Math.PI - this.targetAngle;
                    if (this.y + this.vy < this.size || this.y + this.vy > MAP_SIZE.h - this.size) this.targetAngle = -this.targetAngle;
                } else {
                    // Decelerate smoothly
                    this.vx *= 0.8;
                    this.vy *= 0.8;
                }
            }

            draw(ctx) {
                const isMoving = Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1;

                // If revealed, draw a huge warning glow
                if (Date.now() < this.revealedUntil) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fill();
                    ctx.restore();
                }

                Avatars[this.avatarType](ctx, this.x, this.y, this.size, this.color, isMoving, this.angle);
            }

            tryTag() {
                const now = Date.now();
                if (now - this.lastTagTime < 1000) return; // 1s cooldown
                this.lastTagTime = now;

                // Visual tag effect
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.arc(0, 0, TAG_RANGE, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();

                // Check collisions
                let taggedSomething = false;
                for (let other of entities) {
                    if (other === this) continue;

                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < TAG_RANGE + other.size) {
                        taggedSomething = true;

                        // Did we tag the other player?
                        if (other.isPlayer) {
                            handleWin(this.playerNum);
                            return;
                        } else {
                            // Penalty: Reveal self for 3 seconds
                            this.revealedUntil = now + REVEAL_DURATION;
                        }
                    }
                }

                // If swung and missed everything, minor penalty? (Optional, skipping for now)
            }
        }

        // ------------------
        // ENVIRONMENT RENDERING
        // ------------------
        function initEnvironment() {
            bgParticles = [];
            if (theme === "Biological Lab") {
                for (let i = 0; i < 100; i++) {
                    bgParticles.push({
                        x: rand(0, MAP_SIZE.w),
                        y: rand(0, MAP_SIZE.h),
                        r: rand(10, 50),
                        vy: rand(-0.5, -1),
                        alpha: rand(0.05, 0.2)
                    });
                }
            } else if (theme === "Deep Space") {
                for (let i = 0; i < 200; i++) {
                    bgParticles.push({
                        x: rand(0, MAP_SIZE.w),
                        y: rand(0, MAP_SIZE.h),
                        z: rand(0.1, 1), // Parallax factor
                        size: rand(1, 3)
                    });
                }
            }
        }

        function drawEnvironment() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            if (theme === "Neon District") {
                // Draw Grid
                ctx.strokeStyle = 'rgba(0, 100, 255, 0.2)';
                ctx.lineWidth = 1;
                const gridSize = 100;

                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                }
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                }
                ctx.stroke();

                // Map Bounds
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 5;
                ctx.strokeRect(0, 0, MAP_SIZE.w, MAP_SIZE.h);

            } else if (theme === "Biological Lab") {
                // Green sludge background
                ctx.fillStyle = '#021005';
                ctx.fillRect(0, 0, MAP_SIZE.w, MAP_SIZE.h);

                // Map Bounds
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 5;
                ctx.strokeRect(0, 0, MAP_SIZE.w, MAP_SIZE.h);

                // Bubbling particles
                bgParticles.forEach(p => {
                    p.y += p.vy;
                    if (p.y + p.r < 0) p.y = MAP_SIZE.h + p.r;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 50, ${p.alpha})`;
                    ctx.fill();
                });
            } else if (theme === "Deep Space") {
                // Starfield with parallax
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, MAP_SIZE.w, MAP_SIZE.h);

                // Map Bounds
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, MAP_SIZE.w, MAP_SIZE.h);

                ctx.fillStyle = '#ffffff';
                bgParticles.forEach(p => {
                    // Parallax offset (slight drift based on time)
                    const pX = (p.x + performance.now() * 0.05 * p.z) % canvas.width;
                    const pY = p.y;

                    ctx.beginPath();
                    ctx.arc(pX, pY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            ctx.restore();
        }


        // ------------------
        // GAME ENGINE
        // ------------------
        function startGame() {
            const p1AvatarStr = document.getElementById('p1Avatar').value;
            const p2AvatarStr = document.getElementById('p2Avatar').value;
            theme = document.getElementById('themeSelect').value;

            initEnvironment();

            entities = [];

            // Collect all possible avatars to distribute among bots
            const avatarTypes = Object.keys(Avatars);

            // 48 Bots
            for (let i = 0; i < TOTAL_ENTITIES - 2; i++) {
                const randomAvatar = avatarTypes[Math.floor(Math.random() * avatarTypes.length)];
                entities.push(new Entity(false, 0, randomAvatar));
            }

            // 2 Players
            entities.push(new Entity(true, 1, p1AvatarStr));
            entities.push(new Entity(true, 2, p2AvatarStr));

            // Mix the array so players draw order is hidden
            entities.sort(() => Math.random() - 0.5);

            mainMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            hud.style.opacity = 1;

            updateScoreBoard();
            currentState = STATE.PLAYING;
            lastTime = performance.now();
        }

        function handleWin(winnerNum) {
            currentState = STATE.GAME_OVER;
            hud.style.opacity = 0;

            if (winnerNum === 1) p1Score++;
            else p2Score++;
            updateScoreBoard();

            winnerText.textContent = `PLAYER ${winnerNum} WINS!`;
            winnerText.style.color = (winnerNum === 1) ? '#00ffff' : '#ff00ff';
            gameOverMenu.style.borderColor = (winnerNum === 1) ? '#00ffff' : '#ff00ff';

            gameOverSubtext.textContent = "The mimic has been exposed.";

            setTimeout(() => {
                gameOverMenu.classList.remove('hidden');
            }, 500); // Small delay to show tag effect
        }

        function updateScoreBoard() {
            scoreBoard.textContent = `P1: ${p1Score} - P2: ${p2Score}`;
        }

        let lastTime = 0;
        let lastP1TagKey = false;
        let lastP2TagKey = false;

        function gameLoop(time) {
            const dt = time - lastTime;
            lastTime = time;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentState === STATE.PLAYING) {
                // Update Entities
                entities.forEach(ent => ent.update(dt));

                // Handle Interactions mapping
                const p1TagKey = keys['Space'];
                const p2TagKey = keys['Enter'];

                // Find players
                let p1, p2;
                entities.forEach(e => {
                    if (e.isPlayer && e.playerNum === 1) p1 = e;
                    if (e.isPlayer && e.playerNum === 2) p2 = e;
                });

                if (p1TagKey && !lastP1TagKey && p1) p1.tryTag();
                if (p2TagKey && !lastP2TagKey && p2) p2.tryTag();

                lastP1TagKey = p1TagKey;
                lastP2TagKey = p2TagKey;

                // Update Camera: omitted since MAP_SIZE = screen size
            }

            // Always draw if playing or game over (freeze frame)
            if (currentState !== STATE.MENU) {
                drawEnvironment();

                ctx.save();

                // Sort entities by Y so they draw appropriately (pseudo 3D depth)
                entities.sort((a, b) => a.y - b.y);

                entities.forEach(ent => ent.draw(ctx));
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        // Init
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            gameOverMenu.classList.add('hidden');
            startGame();
        });

        // Start loop
        requestAnimationFrame(gameLoop);

    </script>
</body>

</html>
